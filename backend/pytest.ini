[pytest]
# Root directory = backend/. Hacemos backend/ importable como cwd para que
# `from config import settings`, `from features.X import Y`, etc. resuelvan
# cuando se corre `pytest` desde la raíz del repo o desde backend/.
pythonpath = .

# Tests viven en backend/tests/
testpaths = tests

markers =
    pg_only: tests that require PostgreSQL (ARRAY(Integer) — D2). Skipped automatically in SQLite-only environments.
